<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Maple ♡</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="stars"></canvas>

  <div class="glow glow-one"></div>
  <div class="glow glow-two"></div>

  <main class="welcome-card">

    <p class="top-badge">✦ A LITTLE WORLD MADE FOR YOU ✦</p>

    <div class="heart-container">
      <div class="heart-orbit orbit-one"></div>
      <div class="heart-orbit orbit-two"></div>
      <div class="heart-orbit orbit-three"></div>
      <span class="heart">♥</span>
    </div>

    <p class="eyebrow">SOMEONE SPECIAL WAS BORN TODAY</p>

    <h1>Happy Birthday</h1>
    <h2 class="name">Maple<span>♡</span></h2>

    <div class="divider"><span>♥</span></div>

    <p class="message">
      Today, a little more magic entered this world.
    </p>

    <p class="birthday-note">
      And this little universe is made especially for you.
    </p>

    <button id="enterButton" class="enter-button">
      ENTER YOUR UNIVERSE <span>→</span>
    </button>

    <p class="bottom-note">MADE WITH LOVE, JUST FOR YOU</p>

  </main>

  <div id="transitionOverlay" class="transition-overlay">
    <div class="transition-heart">♥</div>
    <p>YOUR UNIVERSE AWAITS</p>
    <h2>Welcome, Maple</h2>
    <span>Opening your little world...</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
